<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prüfungstrainer</title>
<style>
/* LIGHT THEME (Default) */
:root, :root[data-theme="light"] {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --surface-2: #F8F9FA;
  --ink: #1F2329;
  --muted: #828A99;
  --line: rgba(0, 0, 0, 0.06);
  --hair: rgba(0, 0, 0, 0.04);
  
  --brand-grad: linear-gradient(135deg, #FFA06C 0%, #FF3B7C 50%, #9022A4 100%);
  --brand: #FF3B7C;
  --brand-bg: var(--brand-grad);
  
  --head-bg: #FFFFFF;
  --on-head: #1F2329;
  --kw-bg: #F4F6F8;
  --kw-hover: #EAECEF;
  
  --brand-soft: rgba(255, 59, 124, 0.08);
  --brand-fl: rgba(255, 59, 124, 0.12);
  --kurs-bg: var(--brand-grad);
  --kurs-ink: #FFFFFF;
  --paper: #FFFFFF;
  --sel: rgba(255, 59, 124, 0.06);
  --seg: #F4F6F8;
  --tab-on: var(--brand-grad);
  
  --ok: #209958;
  --ok-soft: rgba(32, 153, 88, 0.1);
  --bad: #E03E3E;
  --bad-soft: rgba(224, 62, 62, 0.1);
  --warn: #D87B16;
  --part: rgba(216, 123, 22, 0.1);
  --answered: rgba(0, 0, 0, 0.04);
  
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.02);
  --modal-bg: rgba(244, 246, 248, 0.85);
  
  --f-body: Aptos, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --f-display: "Aptos Display", Aptos, "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --r-karte: 20px;
  --r-feld: 12px;
  color-scheme: light;
}

/* DARK THEME */
:root[data-theme="dark"] {
  --bg: #222429;
  --surface: #2b2d33;
  --surface-2: #35373f;
  --ink: #f0f0f0;
  --muted: #9ba0aa;
  --line: rgba(255, 255, 255, 0.05);
  --hair: rgba(255, 255, 255, 0.08);
  
  --head-bg: #2b2d33;
  --on-head: #f0f0f0;
  --kw-bg: #222429;
  --kw-hover: #35373f;
  
  --brand-soft: rgba(255, 59, 124, 0.15);
  --brand-fl: rgba(255, 59, 124, 0.25);
  --paper: #222429;
  --sel: rgba(255, 59, 124, 0.12);
  --seg: #222429;
  
  --ok: #4ade80;
  --ok-soft: rgba(74, 222, 128, 0.12);
  --bad: #f87171;
  --bad-soft: rgba(248, 113, 113, 0.12);
  --warn: #fbbf24;
  --part: rgba(251, 191, 36, 0.12);
  --answered: rgba(255, 255, 255, 0.05);
  
  --shadow: 8px 8px 20px rgba(0, 0, 0, 0.35), -4px -4px 12px rgba(255, 255, 255, 0.02);
  --modal-bg: rgba(34, 36, 41, 0.85);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--f-body); transition: background 0.3s ease, color 0.3s ease; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

@keyframes spin { 100% { transform: rotate(360deg); } }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--muted); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }

/* LAYOUT: Sidebar (PC) vs. Bottom-Bar (Mobile) */
.app-layout { display: flex; min-height: 100vh; }
.sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 1.5rem 1rem; gap: 2rem; position: sticky; top: 0; height: 100vh; z-index: 10; box-shadow: var(--shadow); }
.sidebar-logo { font: 800 1.3rem/1.1 var(--f-display); background: var(--brand-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding-left: 0.5rem; }
.sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; }
.sidebar-link { display: flex; align-items: center; gap: 0.8rem; padding: 0.75rem 1rem; border-radius: var(--r-feld); color: var(--muted); font-weight: 600; text-decoration: none; transition: all 0.2s; background: transparent; border: none; cursor: pointer; text-align: left; width: 100%; }
.sidebar-link:hover { background: var(--surface-2); color: var(--ink); }
.sidebar-link.active { background: var(--brand-soft); color: var(--brand); font-weight: 700; }

.main-content-wrapper { flex: 1; max-width: 52rem; margin: 0 auto; padding: 1.5rem 16px 4rem; display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }

.mobile-bottom-bar { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--surface); border-top: 1px solid var(--line); z-index: 100; padding: 0.5rem 1rem; justify-content: space-around; align-items: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
.mobile-nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; color: var(--muted); font-size: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: none; padding: 4px; }
.mobile-nav-item.active { color: var(--brand); }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .mobile-bottom-bar { display: flex; }
  .main-content-wrapper { padding-bottom: 5rem; }
}

/* Header & Navigation */
.kopf { background: var(--head-bg); color: var(--on-head); border: 1px solid var(--line); border-radius: var(--r-karte); padding: 1.25rem 1.4rem 1.45rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .5rem; transition: background 0.3s ease; }
.kopf-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.kopf-t { font: 800 clamp(1.9rem, 6.6vw, 2.55rem)/1.04 var(--f-display); letter-spacing: -.012em; margin: 0; color: var(--ink); }
.kopf-s { margin: 0; font-size: 1rem; color: var(--muted); }

.header-actions { display: flex; align-items: center; gap: 0.8rem; }
.auth-btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); font-size: 0.85rem; font-weight: 700; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: all 0.2s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
.auth-btn:hover { background: var(--kw-hover); }
.auth-btn.logged-in { background: var(--brand-soft); color: var(--brand); border-color: transparent; }

/* Theme Toggle */
.theme-toggle-wrap { display: inline-flex; }
.theme-toggle-label { position: relative; display: inline-flex; background: var(--kw-bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px; cursor: pointer; box-shadow: inset 0 2px 4px rgba(0,0,0,0.03); user-select: none; }
.theme-toggle-text { position: relative; z-index: 1; padding: 4px 14px; font-size: .85rem; font-weight: 600; color: var(--muted); transition: color 0.3s ease; }
.theme-toggle-bg { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--surface); border-radius: 999px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); border: 1px solid var(--line); }
#theme-toggle:not(:checked) ~ .theme-toggle-label .light-text { color: var(--ink); }
#theme-toggle:checked ~ .theme-toggle-label .dark-text { color: var(--ink); }
#theme-toggle:checked ~ .theme-toggle-label .theme-toggle-bg { transform: translateX(100%); }

.eyebrow, .kurs-l, .res-pct { background: var(--brand-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* Kurswahl & Tabs */
.kurs { margin-top: .6rem; display: flex; flex-direction: column; align-items: flex-start; gap: .45rem; width: 100%; }
@media (min-width: 520px) { .kurs { flex-direction: row; align-items: center; gap: .6rem; } }
.kurs-l { font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.kurswahl { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--kw-bg); border: 1px solid var(--line); width: 100%; box-sizing: border-box; }
.kw { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: .35rem .85rem; border-radius: 10px; font-weight: 600; font-size: .92rem; color: var(--ink); text-decoration: none; white-space: nowrap; border: 0; background: transparent; cursor: pointer; flex: 1 1 auto; text-align: center; transition: background 0.2s; }
.kw:hover { background: var(--kw-hover); }
.kw.an { background-image: var(--brand-grad); background-size: cover; background-repeat: no-repeat; color: var(--kurs-ink); cursor: default; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--seg); border-radius: 14px; border: 1px solid var(--line); align-self: flex-start; max-width: 100%; }
.tabs button { border: 0; background: transparent; min-height: 38px; padding: 0 1.1rem; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--muted); transition: color 0.2s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background-image: var(--tab-on); background-size: cover; background-repeat: no-repeat; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

main { display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }
h2, h3 { text-wrap: balance; margin: 0; }
.titel { font: 700 clamp(1.55rem, 5.4vw, 2rem)/1.12 var(--f-display); letter-spacing: -.01em; color: var(--ink); }
h3 { font: 700 1.08rem/1.25 var(--f-body); }
p { margin: 0; }
.eyebrow { font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.stack { display: flex; flex-direction: column; gap: .85rem; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.split { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; flex-wrap: wrap; }

.karte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-karte); padding: 1.2rem 1.25rem 1.35rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .9rem; min-width: 0; transition: background 0.3s ease, box-shadow 0.3s ease; }

.btn { min-height: 48px; border: 1px solid var(--line); border-radius: var(--r-feld); background: var(--surface-2); color: var(--ink); padding: .55rem 1.15rem; cursor: pointer; font-weight: 600; font-size: 1rem; line-height: 1.15; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; text-decoration: none; box-shadow: 0 2px 5px rgba(0,0,0,0.03); transition: filter 0.2s, background 0.2s;}
.btn:hover { filter: brightness(0.95); }
.btn.primary { background-image: var(--brand-grad); background-size: cover; background-repeat: no-repeat; border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(255, 59, 124, 0.25); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--bad); border-color: transparent; background: var(--bad-soft); box-shadow: none; }
.btn.danger:hover { background: rgba(224, 62, 62, 0.15); }
.btn.warn { background: var(--part); border-color: transparent; color: var(--warn); box-shadow: none; }
.btn.leise { min-height: 40px; border-color: transparent; background: transparent; color: var(--brand); padding-inline: .3rem; text-decoration: underline; box-shadow: none; }
.btn.grow { flex: 1 1 auto; }

/* PDF READER STYLES */
.pdf-reader-container { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-karte); padding: 1rem; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 1rem; }
.pdf-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; flex-wrap: wrap; gap: 0.5rem; background: var(--surface-2); padding: 0.75rem 1rem; border-radius: var(--r-feld); border: 1px solid var(--line); }
.pdf-canvas-wrap { width: 100%; display: flex; justify-content: center; overflow: auto; background: var(--bg); border-radius: 10px; padding: 10px; min-height: 500px; }
canvas.pdf-canvas { max-width: 100%; height: auto !important; box-shadow: var(--shadow); border-radius: 6px; }

/* Chips, Banner & Fakten */
.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { min-height: 42px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--muted); padding: .35rem .9rem .35rem .6rem; cursor: pointer; font-size: .93rem; display: inline-flex; gap: .5rem; align-items: center; text-align: left; transition: background 0.2s, color 0.2s;}
.chip:hover { color: var(--ink); background: var(--kw-hover); }
.chip .hk { position: relative; flex: none; width: 1.15rem; height: 1.15rem; border-radius: 50%; border: 1px solid var(--line); }
.chip .n { font-size: .76rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--sel); border-color: var(--brand); color: var(--ink); font-weight: 600; }
.chip[aria-pressed="true"] .hk { background-image: var(--brand-grad); background-size: cover; background-repeat: no-repeat; border-color: transparent; }
.chip[aria-pressed="true"] .hk::after { content: ""; position: absolute; left: .33rem; top: .14rem; width: .26rem; height: .52rem; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }

.banner { background: var(--brand-soft); box-shadow: none; border: 1px solid var(--brand); }
.banner-learn { background: var(--part); box-shadow: none; border: 1px solid var(--warn); }
.note { border: 1px dashed var(--muted); border-radius: var(--r-feld); background: var(--surface-2); padding: .75rem 1rem; color: var(--ink); font-size: .92rem; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .6rem; }
.facts li { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: .75rem .9rem .8rem; box-shadow: 0 2px 6px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: .2rem; }
.facts b { font: 700 1.9rem/1 var(--f-display); color: var(--ink); }
.facts span { font-size: .84rem; color: var(--muted); }

.exam-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-block: .65rem .7rem; transition: background 0.3s ease; }
.eb { display: flex; flex-direction: column; gap: .15rem; }
.eb-t { font: 700 1.25rem/1.1 var(--f-display); color: var(--ink); }
.eb-s { font-size: .82rem; color: var(--muted); }
.eb-r { align-items: flex-end; }
.timer { font: 700 1.45rem/1 var(--f-body); padding: .35rem .75rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 8px rgba(0,0,0,0.05); color: var(--ink); }
.timer.low { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }

.tag { display: inline-flex; align-items: center; font-size: .76rem; font-weight: 700; padding: .3rem .65rem; border-radius: 999px; background: var(--brand-soft); color: var(--brand); border: 1px solid transparent; }
.tag.learn { background: var(--part); color: var(--warn); border-color: transparent; }
.qtext { font: 600 1.22rem/1.38 var(--f-body); overflow-wrap: anywhere; }

.opts { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.opt { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .8rem; align-items: center; min-height: 56px; padding: .6rem .85rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; transition: background 0.2s, filter 0.2s; }
.opt:hover { filter: brightness(0.97); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.opt .let { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; border: 1px solid var(--line); color: var(--muted); background: var(--surface); flex: none; }
.opt .ot { font-size: 1.02rem; line-height: 1.38; overflow-wrap: anywhere; }
.opts:not([disabled]) .opt:has(input:checked) { background: var(--sel); border-color: var(--brand); }
.opts:not([disabled]) .opt:has(input:checked) .let { background-image: var(--brand-grad); background-size: cover; background-repeat: no-repeat; border-color: transparent; color: #fff; }

.opt .badge { font-size: .78rem; font-weight: 700; white-space: nowrap; padding: .25rem .6rem; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
.opt.is-ok { background: var(--ok-soft) !important; border-color: transparent !important; }
.opt.is-ok .let { background: var(--ok) !important; border-color: transparent !important; color: #fff !important; }
.opt.is-ok .badge { color: var(--ok); background: rgba(32, 153, 88, .15); }
.opt.is-bad { background: var(--bad-soft) !important; border-color: transparent !important; }
.opt.is-bad .let { background: var(--bad) !important; border-color: transparent !important; color: #fff !important; }
.opt.is-bad .badge { color: var(--bad); background: rgba(224, 62, 62, .15); }
.opt.is-miss { background: var(--surface) !important; border: 1px dashed var(--ok) !important; }
.opt.is-miss .let { border-color: var(--ok) !important; color: var(--ok) !important; background: transparent !important; }
.opt.is-miss .badge { color: var(--ok); background: var(--ok-soft); border: 1px solid transparent; }
.opt.is-muted { opacity: .5; }

.lt { font-size: 1.08rem; line-height: 2.55; }
select.gap { font-size: 1rem; line-height: 1.25; min-height: 2.3rem; margin: .1rem .12rem; padding: .2rem .5rem; border: 1px solid var(--line); border-bottom-width: 2.5px; border-radius: 10px; background: var(--surface-2); color: var(--ink); cursor: pointer; }
select.gap.voll { font-weight: 600; background: var(--sel); border-color: var(--brand); }
select.gap.is-ok { background: var(--ok-soft) !important; border-color: var(--ok) !important; color: var(--ok) !important; font-weight: 700; }
select.gap.is-bad { background: var(--bad-soft) !important; border-color: var(--bad) !important; color: var(--bad) !important; }

.zo { display: flex; flex-direction: column; gap: .5rem; }
.zo-row { display: grid; grid-template-columns: 7.6rem minmax(0, 1fr); gap: .4rem .8rem; align-items: center; padding: .55rem .65rem; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.zo-bild { display: block; width: 7.4rem; background: var(--paper); border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; }
.zo-bild svg { display: block; width: 100%; height: auto; }
.zo-text { display: block; font-weight: 600; font-size: .92rem; line-height: 1.25; word-break: break-word; }
.zo-row.zo-txt { grid-template-columns: 11rem minmax(0, 1fr); }
select.zsel { width: 100%; min-height: 46px; font-size: 1rem; padding: .3rem .5rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; }
select.zsel.voll { font-weight: 600; border-color: var(--brand); background: var(--sel); }
.zo-row.is-ok { border-color: transparent !important; background: var(--ok-soft) !important; }
.zo-row.is-bad { border-color: transparent !important; background: var(--bad-soft) !important; }
.zo-fix { grid-column: 1 / -1; font-size: .84rem; color: var(--ok); font-weight: 600; padding-top: .2rem; }

.feedback { padding: .85rem 1rem; display: flex; flex-direction: column; gap: .35rem; border: 1px solid transparent; border-radius: 14px; }
.feedback.ok { background: var(--ok-soft); border-color: rgba(32, 153, 88, 0.2); }
.feedback.bad { background: var(--bad-soft); border-color: rgba(224, 62, 62, 0.2); }
.feedback .verdict { font-weight: 700; font-size: 1.08rem; }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad .verdict { color: var(--bad); }

details.review-card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); padding: .85rem 1rem; transition: all .2s ease; }
details.review-card[open] { background: var(--surface); box-shadow: var(--shadow); border-color: var(--line); }
details.review-card summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: .35rem; user-select: none; }
details.review-card summary::-webkit-details-marker { display: none; }
.review-header { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.review-toggle-btn { font-size: .8rem; font-weight: 700; color: var(--brand); display: inline-flex; align-items: center; gap: .3rem; }
details.review-card[open] .review-toggle-btn { color: var(--muted); }
.review-toggle-icon { display: inline-block; transition: transform .2s ease; }
details.review-card[open] .review-toggle-icon { transform: rotate(180deg); }
.review-content { margin-top: .85rem; padding-top: .85rem; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: .75rem; }

.pq-row { display: grid; grid-template-columns: 18px repeat(8, minmax(0, 1fr)); gap: 4px; }
.pq-n { text-align: center; font-size: .7rem; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.pq-grid { display: flex; flex-direction: column; gap: 4px; }
.pq-row button { position: relative; height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0; cursor: pointer; background: var(--surface-2); color: var(--muted); font-size: .8rem; }
.pq-row button.done { background: var(--answered); color: var(--ink); }
.pq-row button.cur { border-color: var(--brand); background: var(--sel); color: var(--ink); font-weight: 700; }
.pq-row button.flag::after { content: ""; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

.res { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .8rem 1rem; }
.res-pct { font: 700 clamp(3.8rem, 18vw, 5.6rem)/.9 var(--f-display); letter-spacing: -.02em; }
.res-pct span { font-size: .36em; color: var(--muted); -webkit-text-fill-color: var(--muted); }

/* ==========================================

   ========================================= */
let pdfDoc = null, pageNum = 1, pageRendering = false, pageNumPending = null, scale = 1.2, currentPdfFile = '';

async function renderPDFReader(pdfUrl, lehrgangName) {
  currentPdfFile = pdfUrl;
  const main = document.getElementById('main');
  
  main.innerHTML = `
    <section class="karte">
      <span class="eyebrow">Digitales Nachschlagewerk</span>
      <h2 class="titel">Lernmappen & Vorschriften</h2>
      <p class="small muted">Interaktiver Online-Reader. Schützter Original-Dokumentenbetrachter.</p>
      <div class="kurswahl" style="margin-top:0.5rem;">
        <button class="kw ${pdfUrl === 'truppmann.pdf' ? 'an' : ''}" onclick="renderPDFReader('truppmann.pdf', 'Truppmann')">Truppmann</button>
        <button class="kw ${pdfUrl === 'truppfuehrer.pdf' ? 'an' : ''}" onclick="renderPDFReader('truppfuehrer.pdf', 'Truppführer')">Truppführer</button>
        <button class="kw ${pdfUrl === 'verbandsfuehrer.pdf' ? 'an' : ''}" onclick="renderPDFReader('verbandsfuehrer.pdf', 'Verbandsführer')">Verbandsführer</button>
      </div>
    </section>

    <div class="pdf-reader-container" oncopy="return false" oncontextmenu="return false">
      <div class="pdf-controls">
        <div class="row" style="gap: 0.4rem;">
          <button class="btn" onclick="onPrevPage()">◀ Zurück</button>
          <button class="btn" onclick="onNextPage()">Weiter ▶</button>
        </div>
        <div class="small" style="font-weight: 600;">
          Seite <span id="page-num">1</span> von <span id="page-count">--</span>
        </div>
        <div class="row" style="gap: 0.4rem;">
          <button class="btn" onclick="zoomOut()">🔍 -</button>
          <button class="btn" onclick="zoomIn()">🔍 +</button>
        </div>
      </div>
      <div class="pdf-canvas-wrap" id="pdf-canvas-wrap">
        <canvas id="pdf-canvas" class="pdf-canvas"></canvas>
      </div>
    </div>
  `;

  loadPdfDocument(pdfUrl);
}

function loadPdfDocument(url) {
  pdfjsLib.getDocument(url).promise.then(function(pdfDoc_) {
    pdfDoc = pdfDoc_;
    document.getElementById('page-count').textContent = pdfDoc.numPages;
    pageNum = 1;
    renderPage(pageNum);
  }).catch(function(error) {
    document.getElementById('pdf-canvas-wrap').innerHTML = `
      <div style="padding: 3rem; text-align: center; color: var(--bad);">
        <h3>PDF-Datei nicht gefunden</h3>
        <p class="small muted" style="margin-top: 0.5rem;">Bitte stelle sicher, dass die Datei <b>${currentPdfFile}</b> im selben Ordner wie diese HTML-Datei liegt.</p>
      </div>
    `;
  });
}

function renderPage(num) {
  pageRendering = true;
  pdfDoc.getPage(num).then(function(page) {
    const canvas = document.getElementById('pdf-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const viewport = page.getViewport({ scale: scale });
    canvas.height = viewport.height;
    canvas.width = viewport.width;

    const renderContext = { canvasContext: ctx, viewport: viewport };
    const renderTask = page.render(renderContext);

    renderTask.promise.then(function() {
      pageRendering = false;
      if (pageNumPending !== null) {
        renderPage(pageNumPending);
        pageNumPending = null;
      }
    });
  });
  document.getElementById('page-num').textContent = num;
}

window.queueRenderPage = function(num) {
  if (pageRendering) { pageNumPending = num; } else { renderPage(num); }
}

window.onPrevPage = function() {
  if (pageNum <= 1) return;
  pageNum--;
  queueRenderPage(pageNum);
}

window.onNextPage = function() {
  if (pageNum >= pdfDoc.numPages) return;
  pageNum++;
  queueRenderPage(pageNum);
}

window.zoomIn = function() {
  scale += 0.2;
  renderPage(pageNum);
}

window.zoomOut = function() {
  if (scale <= 0.6) return;
  scale -= 0.2;
  renderPage(pageNum);
}

   ========================================= */
function renderProfileHub() {
  const main = document.getElementById('main');
  let h = '<section class="karte">' +
    '<span class="eyebrow">Account & Mitgliedschaft</span>' +
    '<h2 class="titel">Dein Profil</h2>';

  if (currentUser) {
    h += '<p>E-Mail: <b>' + esc(currentUser.email) + '</b></p>' +
      '<div class="note" style="margin-top:.5rem;">Status: <b>Free-Mitglied</b></div>' +
      '<div class="row" style="margin-top:1rem;">' +
      '<button class="btn primary" onclick="alert(\'Stripe Checkout folgt in Kürze!\')">⭐ Auf Premium upgraden</button>' +
      '<button class="btn danger" onclick="handleLogout()">Abmelden</button></div>';
  } else {
    h += '<p class="muted">Du bist aktuell nicht angemeldet. Melde dich an, um deinen Lernfortschritt zu speichern.</p>' +
      '<div class="row" style="margin-top:1rem;">' +
      '<button class="btn primary" onclick="openAuthModal()">Anmelden / Registrieren</button></div>';
  }
  h += '</section>';
  main.innerHTML = h;
}

/* ==========================================
   AUTH LOGIK
   ========================================= */
let currentUser = null;
let authMode = 'login';

async function checkUserSession() {
  const { data: { session } } = await db.auth.getSession();
  updateAuthUI(session?.user || null);
  db.auth.onAuthStateChange((_event, session) => { updateAuthUI(session?.user || null); });
}

function updateAuthUI(user) {
  currentUser = user;
  const mainBtn = document.getElementById('auth-main-btn');
  if (user) {
    mainBtn.textContent = '👤 Profil'; mainBtn.classList.add('logged-in');
    document.getElementById('auth-form').style.display = 'none';
    document.querySelector('.auth-tabs').style.display = 'none';
    document.getElementById('auth-logged-in-view').style.display = 'block';
    document.getElementById('auth-user-email').textContent = `Angemeldet als: ${user.email}`;
    document.getElementById('auth-title').textContent = 'Dein Profil';
    document.getElementById('auth-desc').textContent = 'Hier kannst du deinen Status verwalten.';
  } else {
    mainBtn.textContent = 'Anmelden'; mainBtn.classList.remove('logged-in');
    document.getElementById('auth-form').style.display = 'block';
    document.querySelector('.auth-tabs').style.display = 'flex';
    document.getElementById('auth-logged-in-view').style.display = 'none';
    switchAuthMode('login');
  }
  if (CURRENT_MAIN_VIEW === 'profile') renderProfileHub();
}

window.openAuthModal = function() { document.getElementById('auth-modal').classList.add('open'); };
window.closeAuthModal = function() { document.getElementById('auth-modal').classList.remove('open'); };

document.getElementById('auth-modal').addEventListener('mousedown', function(e) {
  if (e.target === this) { closeAuthModal(); }
});
document.querySelector('.modal-box').addEventListener('mousedown', function(e) {
  e.stopPropagation();
});

window.switchAuthMode = function(mode) {
  authMode = mode;
  document.getElementById('auth-message').className = 'auth-msg';
  const isLogin = mode === 'login';
  
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);
  document.getElementById('auth-title').textContent = isLogin ? 'Willkommen zurück' : 'Konto erstellen';
  document.getElementById('auth-submit-btn').textContent = isLogin ? 'Einloggen' : 'Jetzt Registrieren';
  
  const legalCheck = document.getElementById('auth-legal-check');
  const agbInput = document.getElementById('auth-agb');
  if (isLogin) {
    legalCheck.style.display = 'none';
    agbInput.required = false;
  } else {
    legalCheck.style.display = 'flex';
    agbInput.required = true;
  }
};

window.handleAuthSubmit = async function(e) {
  e.preventDefault();
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const msgBox = document.getElementById('auth-message');
  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner" style="border-top-color:#fff;"></span> Bitte warten...';
  try {
    if (authMode === 'register') {
      const { error } = await db.auth.signUp({ email, password });
      if (error) throw error;
      msgBox.textContent = 'Erfolg! Du bist registriert.'; msgBox.className = 'auth-msg success';
      setTimeout(closeAuthModal, 1500);
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error; closeAuthModal();
    }
  } catch (error) {
    msgBox.textContent = error.message; msgBox.className = 'auth-msg error';
  } finally {
    btn.disabled = false; btn.textContent = authMode === 'login' ? 'Einloggen' : 'Jetzt Registrieren';
  }
};

window.handleLogout = async function() { await db.auth.signOut(); closeAuthModal(); };

/* ==========================================
   KURSE & PRÜFUNGSTRAINER
   ========================================= */
const KURSE_DEF = {
  tm: { id: 'tm', dbName: 'Truppmann', name: 'Truppmann', prefix: 'tm1.', kopfUnter: 'Truppmannausbildung · Kreisausbildung in Thüringen', schema: { mc: { n: 36, p: 1 }, lt: { n: 0, p: 2 }, zo: { n: 4, p: 2 } }, dauer: 30, bestehenPct: 60 },
  tf: { id: 'tf', dbName: 'Truppführer', name: 'Truppführer', prefix: 'tf1.', kopfUnter: 'Truppführerausbildung · Kreisausbildung in Thüringen', schema: { mc: { n: 36, p: 1 }, lt: { n: 0, p: 2 }, zo: { n: 4, p: 2 } }, dauer: 30, bestehenPct: 60 },
  vf: { id: 'vf', dbName: 'Verbandsführer', name: 'Verbandsführer', prefix: 'vf5.', kopfUnter: 'Lehrgänge der Landesfeuerwehrschule Thüringen', schema: { mc: { n: 32, p: 1 }, lt: { n: 4, p: 2 }, zo: { n: 4, p: 2 } }, dauer: 30, bestehenPct: 60 }
};

function makeDgSvg(sterne, farbe) {
  const xs = sterne === 1 ? [60] : (sterne === 2 ? [40, 80] : [26, 60, 94]);
  const p = xs.map(x => `<polygon points="${x},10 ${x+4},16 ${x+10},16 ${x+5},20 ${x+7},26 ${x},22 ${x-7},26 ${x-5},20 ${x-10},16 ${x-4},16" fill="${farbe}"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 38"><rect x="1" y="1" width="118" height="36" rx="4" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>${p}</svg>`;
}
const SVG_ICONS = {
  dg_fma: makeDgSvg(1, '#FF3B7C'), dg_fm: makeDgSvg(2, '#FF3B7C'), dg_ofm: makeDgSvg(3, '#FF3B7C'),
  dg_hfm: makeDgSvg(1, '#828A99'), dg_lm: makeDgSvg(2, '#828A99'), dg_olm: makeDgSvg(3, '#828A99'),
  dg_bm: makeDgSvg(1, '#D87B16'), dg_obm: makeDgSvg(2, '#D87B16'), dg_hbm: makeDgSvg(3, '#D87B16')
};

let AKTUELLER_KURS_ID = new URLSearchParams(window.location.search).get('kurs') || 'tm';
if (!KURSE_DEF[AKTUELLER_KURS_ID]) AKTUELLER_KURS_ID = 'tm';

var DATA = { v: 1, stand: '07.10.2026', kat: {}, fragen: [], konf: {} };
var CACHE = {};
var stats, hist, tage, exam, filt;
var fehlerMode = { aktiv: false, fragen: [], curIdx: 0, phase: 'mappe', it: null };
var KURS, PREFIX, SCHEMA, BESTEHEN_PCT, DAUER, BYID = {}, FR = [];
var timerId = null;

window.wechsleKurs = function(id) {
  if (id === AKTUELLER_KURS_ID) return;
  AKTUELLER_KURS_ID = id;
  if (window.history.pushState) window.history.pushState({ path: window.location.pathname + '?kurs=' + id }, '', window.location.pathname + '?kurs=' + id);
  ladeKursUndStarte();
};

async function ladeKursUndStarte() {
  const cfg = KURSE_DEF[AKTUELLER_KURS_ID];
  const main = document.getElementById('main');
  main.innerHTML = '<p class="note">Lade Fragenkatalog</p>';

  document.title = 'Prüfungstrainer ' + cfg.name;
  document.getElementById('kopf-s').textContent = cfg.kopfUnter;

  const nav = document.getElementById('kurs');
  nav.innerHTML = Object.values(KURSE_DEF).map(k => {
    if (k.id === AKTUELLER_KURS_ID) return '<span class="kw an" aria-current="page">' + k.name + '</span>';
    return '<button class="kw" onclick="wechsleKurs(\'' + k.id + '\')">' + k.name + '</button>';
  }).join('');

  let rows = CACHE[cfg.dbName];
  if (!rows) {
    const { data, error } = await db.from('Fragenkatalog').select('*').eq('Kurs', cfg.dbName);
    if (error || !data || !data.length) {
      main.innerHTML = '<p class="note warnung">Fehler beim Laden aus Supabase: ' + (error ? error.message : 'Keine Fragen gefunden.') + '</p>';
      return;
    }
    rows = data; CACHE[cfg.dbName] = rows;
  }

  DATA.kat = {};
  DATA.konf = { kurs: cfg.id, prefix: cfg.prefix, schema: cfg.schema, dauer: cfg.dauer, bestehenPct: cfg.bestehenPct };
  KURS = cfg.id; PREFIX = cfg.prefix; SCHEMA = cfg.schema; BESTEHEN_PCT = cfg.bestehenPct; DAUER = cfg.dauer;

  DATA.fragen = rows.map(r => {
    const katName = r.Kategorie || 'Allgemein'; DATA.kat[katName] = katName;
    const fTyp = String(r.Fragetyp || 'MC').trim().toUpperCase();
    const q = { id: String(r.ID || r.id), k: katName, q: r.Fragetext || '', e: r.Erklärung || '', s: r.Quelle || '', mappe: r.Lernmappe || r['Lernmappe'] || r['Ausschnitt Lernmappe'] || r.Erklärung || '' };

    if (fTyp === 'MC') {
      const loesung = String(r['Korrekte Lösung'] || '').toLowerCase(); const opts = [];
      for (let i = 1; i <= 8; i++) {
        const val = r['Antwort ' + i];
        if (val && String(val).trim()) opts.push({ text: String(val).trim(), correct: loesung.includes('antwort ' + i) });
      }
      q.o = opts;
    } else if (fTyp === 'ZO') {
      q.t = 'ZO'; q.z = [];
      for (let i = 1; i <= 8; i++) {
        const val = r['Antwort ' + i];
        if (val && String(val).includes('->')) q.z.push(String(val).split('->').map(s => s.trim()));
      }
      if (q.q.startsWith('[Zuordnung] ')) q.q = q.q.replace('[Zuordnung] ', '');
    } else if (fTyp === 'LT') {
      q.t = 'LT'; q.l = [];
      const corrStr = String(r['Korrekte Lösung'] || ''); const corrMap = {};
      corrStr.split(',').forEach(p => { if (p.includes(':')) { const [k, v] = p.split(':'); corrMap[k.trim().toLowerCase()] = v.trim(); } });
      for (let i = 1; i <= 8; i++) {
        const val = r['Antwort ' + i];
        if (val && String(val).includes('Optionen:')) {
          const rawOpts = String(val).split('Optionen:')[1].split(',').map(s => s.trim()).filter(Boolean);
          q.l.push({ options: rawOpts, correct: corrMap['lücke ' + i] || rawOpts[0] });
        }
      }
      if (q.q.startsWith('[Lückentext] ')) q.q = q.q.replace('[Lückentext] ', '');
    }
    return q;
  });

  BYID = {}; DATA.fragen.forEach(q => { BYID[q.id] = q; }); FR = DATA.fragen.filter(q => !q.d);
  stats = store.get('stats', {}); hist = store.get('hist', []); tage = store.get('tage', {}); exam = store.get('exam', null); filt = ladeFilter();
  starte();
}

const store = {
  get: (k, def) => { try { const v = localStorage.getItem(PREFIX + k); return v ? JSON.parse(v) : def; } catch (e) { return def; } },
  set: (k, v) => { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) {} },
  del: (k) => { try { localStorage.removeItem(PREFIX + k); } catch (e) {} }
};

function ladeFilter() {
  const f = store.get('filt', null); let kat = {}; Object.keys(DATA.kat).forEach(k => { kat[k] = f.kat ? f.kat[k] : true; });
  if (f && f.kat) { Object.keys(f.kat).forEach(k => { if (DATA.kat[k]) kat[k] = f.kat[k]; }); }
  return { kat };
}

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }
function reihe(n) { return Array.from({ length: n }, (_, i) => i); }
function typ(q) { return q.t === 'LT' ? 'lt' : (q.t === 'ZO' ? 'zo' : 'mc'); }
function wert(q) { return (SCHEMA[typ(q)] || { p: 1 }).p; }

function neuesItem(q) {
  const t = typ(q);
  if (t === 'mc') return { id: q.id, p: shuffle(q.o.slice()), sel: [], m: 0 };
  if (t === 'lt') return { id: q.id, o: q.l.map(gap => shuffle(gap.options.slice())), a: q.l.map(() => ''), m: 0 };
  const zeilen = shuffle(reihe(q.z.length)); const wahl = []; q.z.forEach(z => { if (!wahl.includes(z[1])) wahl.push(z[1]); });
  return { id: q.id, r: zeilen, c: shuffle(wahl), a: zeilen.map(() => ''), m: 0 };
}

function mcRichtig(it) { return it.p.every((opt, i) => opt.correct ? it.sel.includes(i) : !it.sel.includes(i)); }
function teile(q, it) {
  const t = typ(q);
  if (t === 'mc') return [mcRichtig(it) ? 1 : 0, 1];
  if (t === 'lt') { let n = 0; q.l.forEach((gap, g) => { if (it.a[g] && it.a[g].trim().toLowerCase() === gap.correct.trim().toLowerCase()) n++; }); return [n, q.l.length]; }
  if (t === 'zo') { let n = 0; it.r.forEach((zi, j) => { if (it.a[j] && it.a[j].trim().toLowerCase() === q.z[zi][1].trim().toLowerCase()) n++; }); return [n, it.r.length]; }
  return [0, 1];
}

function anteil(q, it) { const t = teile(q, it); return t[1] > 0 ? t[0] / t[1] : 0; }
function angefangen(it) {
  if (!it) return false; const q = BYID[it.id]; if (!q) return false; const t = typ(q);
  if (t === 'mc') return it.sel.length > 0;
  return it.a.some(v => v && v !== '');
}

function getFehlerFragenIds() {
  const ids = new Set();
  (hist || []).forEach(h => { (h.details || []).forEach(d => { if (d.ant < 1) ids.add(d.id); }); });
  Object.keys(stats || {}).forEach(id => { if (stats[id] && stats[id].n > stats[id].r) ids.add(id); });
  return Array.from(ids).filter(id => BYID[id]);
}

let ANSICHT = 'start';
function geh(v) {
  ANSICHT = v;
  document.querySelectorAll('.tabs button').forEach(b => { b.setAttribute('aria-selected', b.getAttribute('data-view') === v ? 'true' : 'false'); });
  render();
}

document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  geh(b.getAttribute('data-view'));
});

function starte() {
  if (exam && exam.dl <= Date.now()) beendeExam(true);
  geh(exam ? 'exam' : 'start');
}

function render() {
  if (CURRENT_MAIN_VIEW !== 'courses') return;
  if (timerId) { clearInterval(timerId); timerId = null; }
  const main = document.getElementById('main');
  if (ANSICHT === 'exam' && exam) renderExam(main);
  else if (ANSICHT === 'practice') renderPractice(main);
  else if (ANSICHT === 'history') renderHistory(main);
  else if (ANSICHT === 'fehler-learning') renderFehlerLearning(main);
  else renderStart(main);
}

function renderStart(main) {
  let h = '';
  if (exam) {
    h += '<section class="karte banner"><h2 class="titel">Laufende Prüfung</h2><p>Du hast eine unvollendete Prüfung für diesen Kurs.</p>' +
      '<div class="row"><button class="btn primary" onclick="geh(\'exam\')">Fortsetzen</button><button class="btn danger" onclick="brichExamAb()">Abbrechen</button></div></section>';
  }

  const fehlerIds = getFehlerFragenIds();
  if (fehlerIds.length > 0) {
    h += '<section class="karte banner-learn"><span class="eyebrow" style="color:var(--warn); -webkit-text-fill-color:var(--warn); background:none;">Lernchance</span>' +
      '<h2 class="titel" style="color:var(--warn);">Fehler gezielt nacharbeiten</h2><p>Es gibt <b>' + fehlerIds.length + ' Fragen</b>, die du bisher noch nicht fehlerfrei beantwortet hast.</p>' +
      '<div class="row"><button class="btn warn grow" onclick="starteFehlerLernmodus()">📖 Fehler-Training mit Lernmappe starten</button></div></section>';
  }

  const gesamtFragen = FR.length; let geuebt = 0; Object.keys(stats).forEach(id => { if (stats[id] && stats[id].n) geuebt++; });

  h += '<section class="karte"><span class="eyebrow">' + KURSE_DEF[KURS].name + '</span><h2 class="titel">Prüfung</h2>' +
    '<p>Simuliere den echten Leistungsnachweis mit Zeitbegrenzung (' + DAUER + ' Min.) und Zufallsfragen.</p>' +
    '<ul class="facts"><li><b>' + (SCHEMA.mc ? SCHEMA.mc.n : 0) + '</b><span>Multiple-Choice</span></li>' +
    '<li><b>' + ((SCHEMA.zo ? SCHEMA.zo.n : 0) + (SCHEMA.lt ? SCHEMA.lt.n : 0)) + '</b><span>Zuordnung / Lückentext</span></li>' +
    '<li><b>' + DAUER + ' Min</b><span>Zeitlimit</span></li><li><b>' + BESTEHEN_PCT + ' %</b><span>Bestehensgrenze</span></li></ul>' +
    '<button class="btn primary grow" onclick="starteNeuePruefung()">Prüfung starten</button></section>';

  h += '<section class="karte"><h3 class="titel">Lernstand</h3><p>' + geuebt + ' von ' + gesamtFragen + ' Fragen in diesem Kurs geübt.</p>' +
    '<div class="row"><button class="btn" onclick="geh(\'practice\')">Jetzt Üben</button><button class="btn" onclick="geh(\'history\')">Verlauf ansehen</button>' +
    (fehlerIds.length > 0 ? '<button class="btn warn" onclick="starteFehlerLernmodus()">📖 ' + fehlerIds.length + ' Fehler trainieren</button>' : '') + '</div></section>';
  main.innerHTML = h;
}

window.starteNeuePruefung = function() {
  const pool = shuffle(FR.slice()); const gewaehlt = [];
  const mcBedarf = (SCHEMA.mc && SCHEMA.mc.n) || 32; const zoBedarf = (SCHEMA.zo && SCHEMA.zo.n) || 0; const ltBedarf = (SCHEMA.lt && SCHEMA.lt.n) || 0;
  gewaehlt.push(...pool.filter(q => typ(q) === 'mc').slice(0, mcBedarf), ...pool.filter(q => typ(q) === 'zo').slice(0, zoBedarf), ...pool.filter(q => typ(q) === 'lt').slice(0, ltBedarf));
  exam = { v: 3, start: Date.now(), dl: Date.now() + DAUER * 60 * 1000, items: shuffle(gewaehlt).map(q => neuesItem(q)), cur: 0 };
  store.set('exam', exam); geh('exam');
};

window.brichExamAb = function() { if (confirm("Möchtest du die laufende Prüfung wirklich abbrechen?")) { exam = null; store.del('exam'); geh('start'); } };
window.starteFehlerLernmodus = function() { alert("Fehler-Training ist im PDF-Modus nicht aktiv."); };

function renderExam(main) {
  if (!exam || !exam.items.length) { geh('start'); return; }
  const curIdx = exam.cur; const it = exam.items[curIdx]; const q = BYID[it.id]; const t = typ(q);
  let restSek = Math.max(0, Math.floor((exam.dl - Date.now()) / 1000)); if (restSek <= 0) { beendeExam(true); return; }

  let h = '<div class="exam-bar"><div class="eb"><span class="eb-t">Frage ' + (curIdx + 1) + ' von ' + exam.items.length + '</span><span class="eb-s">' + esc(q.k) + '</span></div>' +
    '<div class="eb eb-r" style="display:flex; flex-direction:row; align-items:center; gap:.5rem;"><span class="timer' + (restSek < 300 ? ' low' : '') + '" id="exam-timer">' + Math.floor(restSek / 60) + ':' + String(restSek % 60).padStart(2, '0') + '</span>' +
    '<button class="btn danger" style="min-height:36px; padding:.2rem .65rem; font-size:.85rem;" onclick="abbrechenExam()">Abbrechen</button></div></div>';

  h += '<article class="karte"><div class="qmeta"><span class="tag">' + esc(q.k) + '</span></div>';
  if (t !== 'lt') h += '<p class="qtext">' + esc(q.q) + '</p>';

  if (t === 'mc') {
    h += '<fieldset class="opts">';
    it.p.forEach((opt, displayIdx) => {
      const checked = it.sel.includes(displayIdx) ? ' checked' : '';
      h += '<label class="opt"><input type="checkbox" onchange="toggleExamMc(' + displayIdx + ')"' + checked + '><span class="let">' + String.fromCharCode(65 + displayIdx) + '</span><span class="ot">' + esc(opt.text) + '</span><span></span></label>';
    });
    h += '</fieldset>';
  } else if (t === 'zo') {
    h += '<div class="zo">';
    it.r.forEach((zi, j) => {
      const linksKey = q.z[zi][0]; const svgIcon = SVG_ICONS[linksKey]; const linksHtml = svgIcon ? '<span class="zo-bild">' + svgIcon + '</span>' : '<span class="zo-text">' + esc(linksKey) + '</span>';
      h += '<div class="zo-row' + (!svgIcon ? ' zo-txt' : '') + '">' + linksHtml + '<select class="zsel' + (it.a[j] ? ' voll' : '') + '" onchange="setExamZo(' + j + ', this.value)"><option value="">-- Bitte wählen --</option>';
      it.c.forEach((cText) => { h += '<option value="' + esc(cText) + '"' + (it.a[j] === cText ? ' selected' : '') + '>' + esc(cText) + '</option>'; }); h += '</select></div>';
    });
    h += '</div>';
  } else if (t === 'lt') {
    let text = esc(q.q);
    q.l.forEach((gap, g) => {
      let selHtml = '<select class="gap' + (it.a[g] ? ' voll' : '') + '" onchange="setExamLt(' + g + ', this.value)"><option value="">-- Lücke ' + (g + 1) + ' --</option>';
      it.o[g].forEach((optText) => { selHtml += '<option value="' + esc(optText) + '"' + (it.a[g] === optText ? ' selected' : '') + '>' + esc(optText) + '</option>'; });
      selHtml += '</select>'; text = text.replace('___', selHtml);
    });
    h += '<div class="lt">' + text + '</div>';
  }

  h += '<div class="split" style="margin-top:1rem;"><button class="btn" onclick="flagFrage()">' + (it.m ? '🚩 Markiert' : '🏳️ Merken') + '</button><div class="row">' +
    (curIdx > 0 ? '<button class="btn" onclick="gehExamFrage(' + (curIdx - 1) + ')">Zurück</button>' : '') + (curIdx < exam.items.length - 1 ? '<button class="btn primary" onclick="gehExamFrage(' + (curIdx + 1) + ')">Weiter</button>' : '<button class="btn primary" onclick="beendeExam(false)">Prüfung abgeben</button>') + '</div></div></article>';

  main.innerHTML = h;

  timerId = setInterval(() => {
    let r = Math.max(0, Math.floor((exam.dl - Date.now()) / 1000)); const tEl = document.getElementById('exam-timer');
    if (tEl) { tEl.textContent = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0'); if (r < 300) tEl.classList.add('low'); }
    if (r <= 0) beendeExam(true);
  }, 1000);
}

window.gehExamFrage = function(idx) { exam.cur = idx; store.set('exam', exam); render(); }; 
window.flagFrage = function() { exam.items[exam.cur].m = exam.items[exam.cur].m ? 0 : 1; store.set('exam', exam); render(); };
window.toggleExamMc = function(idx) { const it = exam.items[exam.cur]; const pos = it.sel.indexOf(idx); if (pos >= 0) it.sel.splice(pos, 1); else it.sel.push(idx); store.set('exam', exam); render(); };
window.setExamZo = function(j, val) { exam.items[exam.cur].a[j] = val; store.set('exam', exam); render(); }; 
window.setExamLt = function(g, val) { exam.items[exam.cur].a[g] = val; store.set('exam', exam); render(); };

window.abbrechenExam = function() {
  if (!confirm("Prüfung abbrechen?")) return;
  if (timerId) clearInterval(timerId);
  exam = null; store.del('exam'); geh('start');
};

window.beendeExam = function(auto) {
  if (!auto && !confirm("Prüfung abgeben?")) return;
  if (timerId) clearInterval(timerId);
  exam = null; store.del('exam'); geh('start');
};

function renderPractice(main) {
  main.innerHTML = '<section class="karte"><h2 class="titel">Übungsmodus</h2><p>Wähle eine Frage zum Üben.</p></section>';
}

function renderHistory(main) {
  main.innerHTML = '<section class="karte"><h2 class="titel">Verlauf</h2><p>Dein Lernverlauf.</p></section>';
}

window.addEventListener('DOMContentLoaded', () => { 
  initTheme(); 
  checkUserSession();
  ladeKursUndStarte(); 
});
</script>
