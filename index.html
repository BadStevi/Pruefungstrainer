<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prüfungstrainer</title>
<style>
/* LIGHT THEME (Default) */
:root, :root[data-theme="light"] {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --surface-2: #F8F9FA;
  --ink: #1F2329;
  --muted: #828A99;
  --line: rgba(0, 0, 0, 0.06);
  --hair: rgba(0, 0, 0, 0.04);
  
  --brand-grad: linear-gradient(135deg, #FFA06C 0%, #FF3B7C 50%, #9022A4 100%);
  --brand: #FF3B7C;
  --brand-bg: var(--brand-grad);
  
  --head-bg: #FFFFFF;
  --on-head: #1F2329;
  --kw-bg: #F4F6F8;
  --kw-hover: #EAECEF;
  
  --brand-soft: rgba(255, 59, 124, 0.08);
  --brand-fl: rgba(255, 59, 124, 0.12);
  --kurs-bg: var(--brand-grad);
  --kurs-ink: #FFFFFF;
  --paper: #FFFFFF;
  --sel: rgba(255, 59, 124, 0.06);
  --seg: #F4F6F8;
  --tab-on: var(--brand-grad);
  
  --ok: #209958;
  --ok-soft: rgba(32, 153, 88, 0.1);
  --bad: #E03E3E;
  --bad-soft: rgba(224, 62, 62, 0.1);
  --warn: #D87B16;
  --part: rgba(216, 123, 22, 0.1);
  --answered: rgba(0, 0, 0, 0.04);
  
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.02);
  --modal-bg: rgba(244, 246, 248, 0.85);
  
  --f-body: Aptos, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --f-display: "Aptos Display", Aptos, "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --r-karte: 20px;
  --r-feld: 12px;
  color-scheme: light;
}

/* DARK THEME */
:root[data-theme="dark"] {
  --bg: #222429;
  --surface: #2b2d33;
  --surface-2: #35373f;
  --ink: #f0f0f0;
  --muted: #9ba0aa;
  --line: rgba(255, 255, 255, 0.05);
  --hair: rgba(255, 255, 255, 0.08);
  
  --head-bg: #2b2d33;
  --on-head: #f0f0f0;
  --kw-bg: #222429;
  --kw-hover: #35373f;
  
  --brand-soft: rgba(255, 59, 124, 0.15);
  --brand-fl: rgba(255, 59, 124, 0.25);
  --paper: #222429;
  --sel: rgba(255, 59, 124, 0.12);
  --seg: #222429;
  
  --ok: #4ade80;
  --ok-soft: rgba(74, 222, 128, 0.12);
  --bad: #f87171;
  --bad-soft: rgba(248, 113, 113, 0.12);
  --warn: #fbbf24;
  --part: rgba(251, 191, 36, 0.12);
  --answered: rgba(255, 255, 255, 0.05);
  
  --shadow: 8px 8px 20px rgba(0, 0, 0, 0.35), -4px -4px 12px rgba(255, 255, 255, 0.02);
  --modal-bg: rgba(34, 36, 41, 0.85);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1rem/1.5 var(--f-body); transition: background 0.3s ease, color 0.3s ease; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

@keyframes spin { 100% { transform: rotate(360deg); } }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--muted); border-top-color: var(--brand); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }

/* ========================================================================
   RESPONSIVES LAYOUT: Sidebar (PC) vs. Bottom-Bar (Mobile)
   ======================================================================== */
.app-layout { display: flex; min-height: 100vh; }

/* Sidebar für PC & Tablet */
.sidebar {
  width: 260px; background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; padding: 1.5rem 1rem; gap: 2rem;
  position: sticky; top: 0; height: 100vh; z-index: 10;
  box-shadow: var(--shadow);
}
.sidebar-logo { font: 800 1.3rem/1.1 var(--f-display); background: var(--brand-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding-left: 0.5rem; }
.sidebar-nav { display: flex; flex-direction: column; gap: 0.5rem; }
.sidebar-link {
  display: flex; align-items: center; gap: 0.8rem; padding: 0.75rem 1rem; border-radius: var(--r-feld);
  color: var(--muted); font-weight: 600; text-decoration: none; transition: all 0.2s; background: transparent; border: none; cursor: pointer; text-align: left; width: 100%;
}
.sidebar-link:hover { background: var(--surface-2); color: var(--ink); }
.sidebar-link.active { background: var(--brand-soft); color: var(--brand); font-weight: 700; }

/* Hauptinhalt Bereich */
.main-content-wrapper { flex: 1; max-width: 46rem; margin: 0 auto; padding: 1.5rem 16px 4rem; display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }

/* Mobile Bottom Bar (Wird nur auf Handys angezeigt) */
.mobile-bottom-bar {
  display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--surface);
  border-top: 1px solid var(--line); z-index: 100; padding: 0.5rem 1rem;
  justify-content: space-around; align-items: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
}
.mobile-nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none;
  color: var(--muted); font-size: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: none; padding: 4px;
}
.mobile-nav-item.active { color: var(--brand); }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .mobile-bottom-bar { display: flex; }
  .main-content-wrapper { padding-bottom: 5rem; } /* Platz für untere Leiste */
}

/* Header & Navigation */
.kopf { background: var(--head-bg); color: var(--on-head); border: 1px solid var(--line); border-radius: var(--r-karte); padding: 1.25rem 1.4rem 1.45rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .5rem; transition: background 0.3s ease; }
.kopf-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
.kopf-t { font: 800 clamp(1.9rem, 6.6vw, 2.55rem)/1.04 var(--f-display); letter-spacing: -.012em; margin: 0; color: var(--ink); transition: color 0.3s ease;}
.kopf-s { margin: 0; font-size: 1rem; color: var(--muted); }

.header-actions { display: flex; align-items: center; gap: 0.8rem; }
.auth-btn { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); font-size: 0.85rem; font-weight: 700; padding: 6px 14px; border-radius: 999px; cursor: pointer; transition: all 0.2s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
.auth-btn:hover { background: var(--kw-hover); }
.auth-btn.logged-in { background: var(--brand-soft); color: var(--brand); border-color: transparent; }

/* Theme Toggle */
.theme-toggle-wrap { display: inline-flex; }
.theme-toggle-label { position: relative; display: inline-flex; background: var(--kw-bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px; cursor: pointer; box-shadow: inset 0 2px 4px rgba(0,0,0,0.03); user-select: none; -webkit-tap-highlight-color: transparent; }
.theme-toggle-text { position: relative; z-index: 1; padding: 4px 14px; font-size: .85rem; font-weight: 600; color: var(--muted); transition: color 0.3s ease; }
.theme-toggle-bg { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); background: var(--surface); border-radius: 999px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1); border: 1px solid var(--line); }
#theme-toggle:not(:checked) ~ .theme-toggle-label .light-text { color: var(--ink); }
#theme-toggle:checked ~ .theme-toggle-label .dark-text { color: var(--ink); }
#theme-toggle:checked ~ .theme-toggle-label .theme-toggle-bg { transform: translateX(100%); }

.eyebrow, .kurs-l, .res-pct { background: var(--brand-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* Kurswahl & Tabs */
.kurs { margin-top: .6rem; display: flex; flex-direction: column; align-items: flex-start; gap: .45rem; width: 100%; }
@media (min-width: 520px) { .kurs { flex-direction: row; align-items: center; gap: .6rem; } }
.kurs-l { font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.kurswahl { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 14px; background: var(--kw-bg); border: 1px solid var(--line); width: 100%; box-sizing: border-box; }
.kw { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; padding: .35rem .85rem; border-radius: 10px; font-weight: 600; font-size: .92rem; color: var(--ink); text-decoration: none; white-space: nowrap; border: 0; background: transparent; cursor: pointer; flex: 1 1 auto; text-align: center; -webkit-tap-highlight-color: transparent; transition: background 0.2s; }
.kw:hover { background: var(--kw-hover); }
.kw.an { background: var(--brand-grad); color: var(--kurs-ink); cursor: default; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--seg); border-radius: 14px; border: 1px solid var(--line); align-self: flex-start; max-width: 100%; }
.tabs button { border: 0; background: transparent; min-height: 38px; padding: 0 1.1rem; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--muted); -webkit-tap-highlight-color: transparent; transition: color 0.2s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--tab-on); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

main { display: flex; flex-direction: column; gap: 1.2rem; min-width: 0; }
h2, h3 { text-wrap: balance; margin: 0; }
.titel { font: 700 clamp(1.55rem, 5.4vw, 2rem)/1.12 var(--f-display); letter-spacing: -.01em; color: var(--ink); }
h3 { font: 700 1.08rem/1.25 var(--f-body); }
p { margin: 0; }
.eyebrow { font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.stack { display: flex; flex-direction: column; gap: .85rem; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.split { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; flex-wrap: wrap; }

.karte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-karte); padding: 1.2rem 1.25rem 1.35rem; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: .9rem; min-width: 0; transition: background 0.3s ease, box-shadow 0.3s ease; }

.btn { min-height: 48px; border: 1px solid var(--line); border-radius: var(--r-feld); background: var(--surface-2); color: var(--ink); padding: .55rem 1.15rem; cursor: pointer; font-weight: 600; font-size: 1rem; line-height: 1.15; display: inline-flex; align-items: center; justify-content: center; gap: .45rem; text-decoration: none; -webkit-tap-highlight-color: transparent; box-shadow: 0 2px 5px rgba(0,0,0,0.03); transition: filter 0.2s, background 0.2s;}
.btn:hover { filter: brightness(0.95); }
.btn.primary { background: var(--brand-grad); border-color: transparent; color: #fff; box-shadow: 0 4px 14px rgba(255, 59, 124, 0.25); }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--bad); border-color: transparent; background: var(--bad-soft); box-shadow: none; }
.btn.danger:hover { background: rgba(224, 62, 62, 0.15); }
.btn.warn { background: var(--part); border-color: transparent; color: var(--warn); box-shadow: none; }
.btn.leise { min-height: 40px; border-color: transparent; background: transparent; color: var(--brand); padding-inline: .3rem; text-decoration: underline; box-shadow: none; }
.btn.grow { flex: 1 1 auto; }

.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip { min-height: 42px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--muted); padding: .35rem .9rem .35rem .6rem; cursor: pointer; font-size: .93rem; display: inline-flex; gap: .5rem; align-items: center; text-align: left; transition: background 0.2s, color 0.2s;}
.chip:hover { color: var(--ink); background: var(--kw-hover); }
.chip .hk { position: relative; flex: none; width: 1.15rem; height: 1.15rem; border-radius: 50%; border: 1px solid var(--line); }
.chip .n { font-size: .76rem; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--sel); border-color: var(--brand); color: var(--ink); font-weight: 600; }
.chip[aria-pressed="true"] .hk { background: var(--brand-grad); border-color: transparent; }
.chip[aria-pressed="true"] .hk::after { content: ""; position: absolute; left: .33rem; top: .14rem; width: .26rem; height: .52rem; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }

.banner { background: var(--brand-soft); box-shadow: none; border: 1px solid var(--brand); }
.banner-learn { background: var(--part); box-shadow: none; border: 1px solid var(--warn); }
.note { border: 1px dashed var(--muted); border-radius: var(--r-feld); background: var(--surface-2); padding: .75rem 1rem; color: var(--ink); font-size: .92rem; }
.facts { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .6rem; }
.facts li { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: .75rem .9rem .8rem; box-shadow: 0 2px 6px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: .2rem; }
.facts b { font: 700 1.9rem/1 var(--f-display); color: var(--ink); }
.facts span { font-size: .84rem; color: var(--muted); }

.exam-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-block: .65rem .7rem; transition: background 0.3s ease; }
.eb { display: flex; flex-direction: column; gap: .15rem; }
.eb-t { font: 700 1.25rem/1.1 var(--f-display); color: var(--ink); }
.eb-s { font-size: .82rem; color: var(--muted); }
.eb-r { align-items: flex-end; }
.timer { font: 700 1.45rem/1 var(--f-body); padding: .35rem .75rem; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 4px 8px rgba(0,0,0,0.05); color: var(--ink); }
.timer.low { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }

.tag { display: inline-flex; align-items: center; font-size: .76rem; font-weight: 700; padding: .3rem .65rem; border-radius: 999px; background: var(--brand-soft); color: var(--brand); border: 1px solid transparent; }
.tag.learn { background: var(--part); color: var(--warn); border-color: transparent; }
.qtext { font: 600 1.22rem/1.38 var(--f-body); overflow-wrap: anywhere; }

.opts { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; min-width: 0; }
.opt { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .8rem; align-items: center; min-height: 56px; padding: .6rem .85rem; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.2s, filter 0.2s; }
.opt:hover { filter: brightness(0.97); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; pointer-events: none; }
.opt .let { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem; border: 1px solid var(--line); color: var(--muted); background: var(--surface); flex: none; }
.opt .ot { font-size: 1.02rem; line-height: 1.38; overflow-wrap: anywhere; }
.opts:not([disabled]) .opt:has(input:checked) { background: var(--sel); border-color: var(--brand); }
.opts:not([disabled]) .opt:has(input:checked) .let { background: var(--brand-grad); border-color: transparent; color: #fff; }

.opt .badge { font-size: .78rem; font-weight: 700; white-space: nowrap; padding: .25rem .6rem; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
.opt.is-ok { background: var(--ok-soft) !important; border-color: transparent !important; }
.opt.is-ok .let { background: var(--ok) !important; border-color: transparent !important; color: #fff !important; }
.opt.is-ok .badge { color: var(--ok); background: rgba(32, 153, 88, .15); }
.opt.is-bad { background: var(--bad-soft) !important; border-color: transparent !important; }
.opt.is-bad .let { background: var(--bad) !important; border-color: transparent !important; color: #fff !important; }
.opt.is-bad .badge { color: var(--bad); background: rgba(224, 62, 62, .15); }
.opt.is-miss { background: var(--surface) !important; border: 1px dashed var(--ok) !important; }
.opt.is-miss .let { border-color: var(--ok) !important; color: var(--ok) !important; background: transparent !important; }
.opt.is-miss .badge { color: var(--ok); background: var(--ok-soft); border: 1px solid transparent; }
.opt.is-muted { opacity: .5; }

.lt { font-size: 1.08rem; line-height: 2.55; }
select.gap { font-size: 1rem; line-height: 1.25; min-height: 2.3rem; margin: .1rem .12rem; padding: .2rem .5rem; border: 1px solid var(--line); border-bottom-width: 2.5px; border-radius: 10px; background: var(--surface-2); color: var(--ink); cursor: pointer; }
select.gap.voll { font-weight: 600; background: var(--sel); border-color: var(--brand); }
select.gap.is-ok { background: var(--ok-soft) !important; border-color: var(--ok) !important; color: var(--ok) !important; font-weight: 700; }
select.gap.is-bad { background: var(--bad-soft) !important; border-color: var(--bad) !important; color: var(--bad) !important; }

.zo { display: flex; flex-direction: column; gap: .5rem; }
.zo-row { display: grid; grid-template-columns: 7.6rem minmax(0, 1fr); gap: .4rem .8rem; align-items: center; padding: .55rem .65rem; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
.zo-bild { display: block; width: 7.4rem; background: var(--paper); border: 1px solid var(--hair); border-radius: 8px; overflow: hidden; }
.zo-bild svg { display: block; width: 100%; height: auto; }
.zo-text { display: block; font-weight: 600; font-size: .92rem; line-height: 1.25; word-break: break-word; }
.zo-row.zo-txt { grid-template-columns: 11rem minmax(0, 1fr); }
select.zsel { width: 100%; min-height: 46px; font-size: 1rem; padding: .3rem .5rem; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); cursor: pointer; }
select.zsel.voll { font-weight: 600; border-color: var(--brand); background: var(--sel); }
.zo-row.is-ok { border-color: transparent !important; background: var(--ok-soft) !important; }
.zo-row.is-bad { border-color: transparent !important; background: var(--bad-soft) !important; }
.zo-fix { grid-column: 1 / -1; font-size: .84rem; color: var(--ok); font-weight: 600; padding-top: .2rem; }

.feedback { padding: .85rem 1rem; display: flex; flex-direction: column; gap: .35rem; border: 1px solid transparent; border-radius: 14px; }
.feedback.ok { background: var(--ok-soft); border-color: rgba(32, 153, 88, 0.2); }
.feedback.bad { background: var(--bad-soft); border-color: rgba(224, 62, 62, 0.2); }
.feedback .verdict { font-weight: 700; font-size: 1.08rem; }
.feedback.ok .verdict { color: var(--ok); }
.feedback.bad .verdict { color: var(--bad); }

.mappe-preview { border: 1px solid var(--brand); border-radius: var(--r-karte); background: var(--surface); padding: 1.2rem 1.3rem; display: flex; flex-direction: column; gap: .8rem; box-shadow: var(--shadow); }
.mappe-preview .mappe-t { font: 700 1.3rem/1.2 var(--f-display); color: var(--ink); }
.mappe-content { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: .9rem 1.1rem; font-size: .98rem; line-height: 1.5; }

details.review-card { border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); padding: .85rem 1rem; transition: all .2s ease; }
details.review-card[open] { background: var(--surface); box-shadow: var(--shadow); border-color: var(--line); }
details.review-card summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: .35rem; user-select: none; }
details.review-card summary::-webkit-details-marker { display: none; }
.review-header { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.review-toggle-btn { font-size: .8rem; font-weight: 700; color: var(--brand); display: inline-flex; align-items: center; gap: .3rem; }
details.review-card[open] .review-toggle-btn { color: var(--muted); }
.review-toggle-icon { display: inline-block; transition: transform .2s ease; }
details.review-card[open] .review-toggle-icon { transform: rotate(180deg); }
.review-content { margin-top: .85rem; padding-top: .85rem; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: .75rem; }

.pq-row { display: grid; grid-template-columns: 18px repeat(8, minmax(0, 1fr)); gap: 4px; }
.pq-n { text-align: center; font-size: .7rem; font-weight: 600; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.pq-grid { display: flex; flex-direction: column; gap: 4px; }
.pq-row button { position: relative; height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0; cursor: pointer; background: var(--surface-2); color: var(--muted); font-size: .8rem; }
.pq-row button.done { background: var(--answered); color: var(--ink); }
.pq-row button.cur { border-color: var(--brand); background: var(--sel); color: var(--ink); font-weight: 700; }
.pq-row button.flag::after { content: ""; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

.res { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: .8rem 1rem; }
.res-pct { font: 700 clamp(3.8rem, 18vw, 5.6rem)/.9 var(--f-display); letter-spacing: -.02em; }
.res-pct span { font-size: .36em; color: var(--muted); -webkit-text-fill-color: var(--muted); }
.res-side { display: flex; flex-direction: column; align-items: flex-end; gap: .5rem; }

/* ==========================================

   ========================================= */
let currentUser = null;
let authMode = 'login';

async function checkUserSession() {
  const { data: { session } } = await db.auth.getSession();
  updateAuthUI(session?.user || null);
  db.auth.onAuthStateChange((_event, session) => { updateAuthUI(session?.user || null); });
}

function updateAuthUI(user) {
  currentUser = user;
  const mainBtn = document.getElementById('auth-main-btn');
  if (user) {
    mainBtn.textContent = '👤 Profil'; mainBtn.classList.add('logged-in');
    document.getElementById('auth-form').style.display = 'none';
    document.querySelector('.auth-tabs').style.display = 'none';
    document.getElementById('auth-logged-in-view').style.display = 'block';
    document.getElementById('auth-user-email').textContent = `Angemeldet als: ${user.email}`;
    document.getElementById('auth-title').textContent = 'Dein Profil';
    document.getElementById('auth-desc').textContent = 'Hier kannst du deinen Status verwalten.';
  } else {
    mainBtn.textContent = 'Anmelden'; mainBtn.classList.remove('logged-in');
    document.getElementById('auth-form').style.display = 'block';
    document.querySelector('.auth-tabs').style.display = 'flex';
    document.getElementById('auth-logged-in-view').style.display = 'none';
    switchAuthMode('login');
  }

}

window.openAuthModal = function() { document.getElementById('auth-modal').classList.add('open'); };
window.closeAuthModal = function() { document.getElementById('auth-modal').classList.remove('open'); };
window.switchAuthMode = function(mode) {
  authMode = mode;
  document.getElementById('auth-message').className = 'auth-msg';
  const isLogin = mode === 'login';
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-register').classList.toggle('active', !isLogin);
  document.getElementById('auth-title').textContent = isLogin ? 'Willkommen zurück' : 'Konto erstellen';
  document.getElementById('auth-submit-btn').textContent = isLogin ? 'Einloggen' : 'Jetzt Registrieren';
};

window.handleAuthSubmit = async function(e) {
  e.preventDefault();
  const email = document.getElementById('auth-email').value;
  const password = document.getElementById('auth-password').value;
  const msgBox = document.getElementById('auth-message');
  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner" style="border-top-color:#fff;"></span> Bitte warten...';
  try {
    if (authMode === 'register') {
      const { error } = await db.auth.signUp({ email, password });
      if (error) throw error;
      msgBox.textContent = 'Erfolg! Du bist registriert.'; msgBox.className = 'auth-msg success';
      setTimeout(closeAuthModal, 1500);
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error; closeAuthModal();
    }
  } catch (error) {
    msgBox.textContent = error.message; msgBox.className = 'auth-msg error';
  } finally {
    btn.disabled = false; btn.textContent = authMode === 'login' ? 'Einloggen' : 'Jetzt Registrieren';

window.handleLogout = async function() { await db.auth.signOut(); closeAuthModal(); };

function makeDgSvg(sterne, farbe) {
  const xs = sterne === 1 ? [60] : (sterne === 2 ? [40, 80] : [26, 60, 94]);
  const p = xs.map(x => `<polygon points="${x},10 ${x+4},16 ${x+10},16 ${x+5},20 ${x+7},26 ${x},22 ${x-7},26 ${x-5},20 ${x-10},16 ${x-4},16" fill="${farbe}"/>`).join('');

}

window.wechsleKurs = function(id) {
  if (id === AKTUELLER_KURS_ID) return;

async function ladeKursUndStarte() {
  const cfg = KURSE_DEF[AKTUELLER_KURS_ID];
  const main = document.getElementById('main');
  main.innerHTML = '<p class="note">Lade Fragenkatalog für ' + cfg.name + ' aus Supabase …</p>';

  document.title = 'Prüfungstrainer ' + cfg.name;
  document.getElementById('kopf-s').textContent = cfg.kopfUnter;

  const nav = document.getElementById('kurs');
  nav.innerHTML = Object.values(KURSE_DEF).map(k => {
    if (k.id === AKTUELLER_KURS_ID) return '<span class="kw an" aria-current="page">' + k.name + '</span>';
    return '<button class="kw" onclick="wechsleKurs(\'' + k.id + '\')">' + k.name + '</button>';
  }).join('');

  let rows = CACHE[cfg.dbName];
  if (!rows) {
    const { data, error } = await db.from('Fragenkatalog').select('*').eq('Kurs', cfg.dbName);
    if (error || !data || !data.length) {
      main.innerHTML = '<p class="note warnung">Fehler beim Laden aus Supabase: ' + (error ? error.message : 'Keine Fragen gefunden.') + '</p>';
      return;
    }
    rows = data; CACHE[cfg.dbName] = rows;
  }

  DATA.kat = {};
  DATA.konf = { kurs: cfg.id, prefix: cfg.prefix, schema: cfg.schema, dauer: cfg.dauer, bestehenPct: cfg.bestehenPct };
  KURS = cfg.id; PREFIX = cfg.prefix; SCHEMA = cfg.schema; BESTEHEN_PCT = cfg.bestehenPct; DAUER = cfg.dauer;

  DATA.fragen = rows.map(r => {
    const katName = r.Kategorie || 'Allgemein'; DATA.kat[katName] = katName;
    const fTyp = String(r.Fragetyp || 'MC').trim().toUpperCase();
    const q = { id: String(r.ID || r.id), k: katName, q: r.Fragetext || '', e: r.Erklärung || '', s: r.Quelle || '', mappe: r.Lernmappe || r['Lernmappe'] || r['Ausschnitt Lernmappe'] || r.Erklärung || '' };

    if (fTyp === 'MC') {
      const loesung = String(r['Korrekte Lösung'] || '').toLowerCase(); const opts = [];
      for (let i = 1; i <= 8; i++) {
        const val = r['Antwort ' + i];
        if (val && String(val).trim()) opts.push({ text: String(val).trim(), correct: loesung.includes('antwort ' + i) });
      }
      q.o = opts;
    } else if (fTyp === 'ZO') {
      q.t = 'ZO'; q.z = [];
      for (let i = 1; i <= 8; i++) {

      const corrStr = String(r['Korrekte Lösung'] || ''); const corrMap = {};
      corrStr.split(',').forEach(p => { if (p.includes(':')) { const [k, v] = p.split(':'); corrMap[k.trim().toLowerCase()] = v.trim(); } });
      for (let i = 1; i <= 8; i++) {
        const val = r['Antwort ' + i];
        if (val && String(val).includes('Optionen:')) {

const store = {

function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function shuffle(a) { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; }
function reihe(n) { return Array.from({ length: n }, (_, i) => i); }
function typ(q) { return q.t === 'LT' ? 'lt' : (q.t === 'ZO' ? 'zo' : 'mc'); }
function wert(q) { return (SCHEMA[typ(q)] || { p: 1 }).p; }

function neuesItem(q) {
  const t = typ(q);
  if (t === 'mc') return { id: q.id, p: shuffle(q.o.slice()), sel: [], m: 0 };
  if (t === 'lt') return { id: q.id, o: q.l.map(gap => shuffle(gap.options.slice())), a: q.l.map(() => ''), m: 0 };
  const zeilen = shuffle(reihe(q.z.length)); const wahl = []; q.z.forEach(z => { if (!wahl.includes(z[1])) wahl.push(z[1]); });
  return { id: q.id, r: zeilen, c: shuffle(wahl), a: zeilen.map(() => ''), m: 0 };
}

function mcRichtig(it) { return it.p.every((opt, i) => opt.correct ? it.sel.includes(i) : !it.sel.includes(i)); }
function teile(q, it) {
  const t = typ(q);
  if (t === 'mc') return [mcRichtig(it) ? 1 : 0, 1];
  if (t === 'lt') { let n = 0; q.l.forEach((gap, g) => { if (it.a[g] && it.a[g].trim().toLowerCase() === gap.correct.trim().toLowerCase()) n++; }); return [n, q.l.length]; }
  if (t === 'zo') { let n = 0; it.r.forEach((zi, j) => { if (it.a[j] && it.a[j].trim().toLowerCase() === q.z[zi][1].trim().toLowerCase()) n++; }); return [n, it.r.length]; }
  return [0, 1];
}

function anteil(q, it) { const t = teile(q, it); return t[1] > 0 ? t[0] / t[1] : 0; }
function angefangen(it) {
  if (!it) return false; const q = BYID[it.id]; if (!q) return false; const t = typ(q);
  if (t === 'mc') return it.sel.length > 0;

}

function getFehlerFragenIds() {

  Object.keys(stats || {}).forEach(id => { if (stats[id] && stats[id].n > stats[id].r) ids.add(id); });

        h += '<button class="' + cls + '" onclick="gehExamFrage(' + idx + ')">' + (idx + 1) + '</button>';
      } else { h += '<span></span>'; }
    }
    h += '</div>';
  }
  h += '</div></section>';

  main.innerHTML = h;

  timerId = setInterval(() => {
    let r = Math.max(0, Math.floor((exam.dl - Date.now()) / 1000)); const tEl = document.getElementById('exam-timer');
    if (tEl) { tEl.textContent = Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0'); if (r < 300) tEl.classList.add('low'); }
    if (r <= 0) beendeExam(true);
  }, 1000);
}

window.gehExamFrage = function(idx) { exam.cur = idx; store.set('exam', exam); render(); }; window.flagFrage = function() { exam.items[exam.cur].m = exam.items[exam.cur].m ? 0 : 1; store.set('exam', exam); render(); };
window.toggleExamMc = function(idx) { const it = exam.items[exam.cur]; const pos = it.sel.indexOf(idx); if (pos >= 0) it.sel.splice(pos, 1); else it.sel.push(idx); store.set('exam', exam); render(); };
window.setExamZo = function(j, val) { exam.items[exam.cur].a[j] = val; store.set('exam', exam); render(); }; window.setExamLt = function(g, val) { exam.items[exam.cur].a[g] = val; store.set('exam', exam); render(); };

window.abbrechenExam = function() {
  if (!confirm("Möchtest du die laufende Prüfung wirklich abbrechen?\n\nDu erhältst eine Auswertung deiner bisher beantworteten Fragen. Die Prüfung wird NICHT im Verlauf gespeichert.")) return;
  if (timerId) clearInterval(timerId);

  const beantwortete = exam.items.filter(it => angefangen(it)); let punkte = 0, maxPunkte = 0; const details = [];
  beantwortete.forEach(it => { const q = BYID[it.id]; const w = wert(q); const ant = anteil(q, it); const erzielt = ant * w; punkte += erzielt; maxPunkte += w; details.push({ id: q.id, ant: ant, erzielt: erzielt, max: w, it: JSON.parse(JSON.stringify(it)) }); });

  const pct = maxPunkte > 0 ? Math.round((punkte / maxPunkte) * 100) : 0;
  const ergebnis = { datum: new Date().toLocaleDateString('de-DE'), zeit: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }), punkte: Math.round(punkte * 10) / 10, max: maxPunkte, pct: pct, bestanden: false, abgebrochen: true, gesamtFragen: exam.items.length, beantwortetCount: beantwortete.length, details: details };
  exam = null; store.del('exam'); renderErgebnis(ergebnis);
};

window.beendeExam = function(auto) {
  if (!auto && !confirm("Möchtest du deine Prüfung jetzt abgeben und auswerten?")) return;
  if (timerId) clearInterval(timerId);

  let punkte = 0, maxPunkte = 0; const details = [];
  exam.items.forEach(it => {
    const q = BYID[it.id]; const w = wert(q); const ant = anteil(q, it); const erzielt = ant * w; punkte += erzielt; maxPunkte += w;
    details.push({ id: q.id, ant: ant, erzielt: erzielt, max: w, it: JSON.parse(JSON.stringify(it)) });
    stats[q.id] = stats[q.id] || { n: 0, r: 0 }; stats[q.id].n++; if (ant === 1) stats[q.id].r++;
  });

  const pct = maxPunkte > 0 ? Math.round((punkte / maxPunkte) * 100) : 0; const bestanden = pct >= BESTEHEN_PCT;
  const ergebnis = { datum: new Date().toLocaleDateString('de-DE'), zeit: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }), punkte: Math.round(punkte * 10) / 10, max: maxPunkte, pct: pct, bestanden: bestanden, abgebrochen: false, details: details };

  hist.unshift(ergebnis); if (hist.length > 50) hist.pop();
  const heute = new Date().toISOString().slice(0, 10); tage[heute] = tage[heute] || { n: 0, r: 0 }; details.forEach(d => { tage[heute].n++; if (d.ant === 1) tage[heute].r++; });

  store.set('stats', stats); store.set('hist', hist); store.set('tage', tage); exam = null; store.del('exam'); renderErgebnis(ergebnis);
};

function renderReviewContent(q, it) {
  const t = typ(q); let h = '';
  if (t === 'mc') {
    h += '<fieldset class="opts" disabled style="opacity:1;">';
    const items = (it && it.p && it.p.length) ? it.p : (q.o || []).map(o => ({ text: o.replace(/^\+/, ''), correct: o.startsWith('+') }));
    const selected = (it && it.sel) ? it.sel : [];
    items.forEach((opt, displayIdx) => {
      const isSelected = selected.includes(displayIdx); const isCorrect = !!opt.correct; let cls = ''; let badgeHtml = '';
      if (isSelected && isCorrect) { cls = ' is-ok'; badgeHtml = '<span class="badge">✔ Richtig gewählt</span>'; }
      else if (isSelected && !isCorrect) { cls = ' is-bad'; badgeHtml = '<span class="badge">✖ Falsch gewählt</span>'; }
      else if (!isSelected && isCorrect) { cls = ' is-miss'; badgeHtml = '<span class="badge">➕ Hat gefehlt</span>'; } else { cls = ' is-muted'; }
      h += '<label class="opt' + cls + '" style="cursor:default;"><input type="checkbox"' + (isSelected ? ' checked' : '') + ' disabled><span class="let">' + String.fromCharCode(65 + displayIdx) + '</span><span class="ot">' + esc(opt.text) + '</span>' + badgeHtml + '</label>';
    });
    h += '</fieldset>';
  } else if (t === 'zo') {
    h += '<div class="zo">'; const rows = (it && it.r && it.r.length) ? it.r : reihe(q.z.length);
    rows.forEach((zi, j) => {
      const linksKey = q.z[zi][0]; const targetVal = q.z[zi][1]; const userVal = (it && it.a && it.a[j]) ? it.a[j] : '';
      const svgIcon = SVG_ICONS[linksKey]; const linksHtml = svgIcon ? '<span class="zo-bild">' + svgIcon + '</span>' : '<span class="zo-text">' + esc(linksKey) + '</span>';
      const ok = userVal && userVal.trim().toLowerCase() === targetVal.trim().toLowerCase();
      h += '<div class="zo-row' + (!svgIcon ? ' zo-txt' : '') + (ok ? ' is-ok' : ' is-bad') + '" style="padding:.6rem .8rem;">' + linksHtml + '<div style="display:flex; flex-direction:column; gap:.25rem; min-width:0;"><div style="font-size:.92rem; font-weight:600;">' + (userVal ? 'Deine Wahl: ' + esc(userVal) : '<span style="color:var(--bad);">Keine Auswahl getroffen</span>') + '</div>' + (!ok ? '<div class="zo-fix" style="padding:0;">✔ Richtig: <b>' + esc(targetVal) + '</b></div>' : '') + '</div></div>';
    });
    h += '</div>';
  } else if (t === 'lt') {
    let text = esc(q.q);
    q.l.forEach((gap, g) => {
      const userVal = (it && it.a && it.a[g]) ? it.a[g] : ''; const ok = userVal && userVal.trim().toLowerCase() === gap.correct.trim().toLowerCase();
      const badgeCls = ok ? 'is-ok' : 'is-bad'; const badgeText = userVal ? esc(userVal) : 'Keine Auswahl';
      text = text.replace('___', '<span class="gap voll ' + badgeCls + '" style="display:inline-block; padding:.1rem .5rem; border-radius:6px; font-weight:700;">' + badgeText + '</span>');
    });
    h += '<div class="lt">' + text + '</div>';
    const fixes = [];
    q.l.forEach((gap, g) => {
      const userVal = (it && it.a && it.a[g]) ? it.a[g] : ''; const ok = userVal && userVal.trim().toLowerCase() === gap.correct.trim().toLowerCase();
      if (!ok) { fixes.push('<li><b>Lücke ' + (g + 1) + ':</b> Deine Wahl: „' + (userVal ? esc(userVal) : '–') + '“ → <span style="color:var(--ok); font-weight:700;">Richtig ist „' + esc(gap.correct) + '“</span></li>'); } else { fixes.push('<li style="color:var(--ok);"><b>Lücke ' + (g + 1) + ':</b> ✔ Richtig gelöst („' + esc(gap.correct) + '“)</li>'); }
    });
    h += '<ul class="liste small" style="margin-top:.6rem;">' + fixes.join('') + '</ul>';
  }
  h += '<div class="feedback" style="background:var(--surface-2); border-color:var(--line); margin-top:.4rem;"><div class="verdict" style="font-size:.92rem; color:var(--brand);">💡 Erklärung:</div><p class="small" style="line-height:1.45; color:var(--ink);">' + esc(q.e || 'Zu dieser Frage ist keine gesonderte Erklärung hinterlegt.') + '</p>' + (q.s ? '<p class="src" style="margin-top:.2rem;"><b>Quelle:</b> ' + esc(q.s) + '</p>' : '') + '</div>';
  return h;
}

window.toggleAlleDetails = function() {
  const cards = document.querySelectorAll('details.review-card'); if (!cards.length) return;
  const anyClosed = Array.from(cards).some(c => !c.open); cards.forEach(c => { c.open = anyClosed; });
  const label = document.getElementById('toggle-details-text'); if (label) label.textContent = anyClosed ? 'Alle zuklappen' : 'Alle aufklappen';
};

function renderErgebnis(res) {
  const main = document.getElementById('main');
  const statusText = res.abgebrochen ? 'ABGEBROCHEN' : (res.bestanden ? 'BESTANDEN' : 'NICHT BESTANDEN');
  const statusCls = res.abgebrochen ? 'bad' : (res.bestanden ? 'ok' : 'bad');
  const subText = res.abgebrochen ? res.beantwortetCount + ' von ' + res.gesamtFragen + ' Fragen beantwortet (' + res.punkte + ' / ' + res.max + ' Pkt. · nicht im Verlauf gespeichert)' : res.punkte + ' von ' + res.max + ' Punkten erreicht';
  const fehlerIds = getFehlerFragenIds();

  let h = '<section class="karte"><span class="eyebrow">' + (res.abgebrochen ? 'Prüfungsabbruch' : 'Prüfungsergebnis') + '</span><div class="res"><div class="res-pct">' + res.pct + '<span> %</span></div><div class="res-side"><span class="res-state ' + statusCls + '">' + statusText + '</span><span class="res-meta">' + subText + '</span></div></div><div class="row" style="margin-top:1rem;"><button class="btn primary" onclick="starteNeuePruefung()">Neue Prüfung</button>' + (fehlerIds.length > 0 ? '<button class="btn warn" onclick="starteFehlerLernmodus()">📖 Fehler mit Lernmappe trainieren (' + fehlerIds.length + ')</button>' : '') + '<button class="btn" onclick="geh(\'start\')">Zur Übersicht</button></div></section>';

  const falsche = (res.details || []).filter(d => d.ant < 1);
  if (falsche.length) {
    h += '<section class="karte"><div class="split" style="align-items:center;"><h3 class="titel small">Auswertung der Fragen mit Fehlern (' + falsche.length + ')</h3><button class="btn leise" onclick="toggleAlleDetails()"><span id="toggle-details-text">Alle aufklappen</span></button></div><p class="small muted" style="margin-top:-.4rem;">Tippe auf eine Frage, um deine Antwort, die Korrektur und die Erklärung einzusehen.</p><div class="stack" style="margin-top:.5rem;">';
    falsche.forEach(f => {
      const q = BYID[f.id]; if (!q) return; const isPart = f.ant > 0; const statusLabel = isPart ? 'Teilweise richtig' : 'Falsch beantwortet'; const statusColor = isPart ? 'var(--warn)' : 'var(--bad)'; const statusBg = isPart ? 'var(--part)' : 'var(--bad-soft)';
      h += '<details class="review-card" ontoggle="if(this.open) ladeHintergrund(\'' + q.id + '\', \'review-hintergrund-' + q.id + '\')"><summary><div class="review-header"><div class="row" style="gap:.4rem;"><span class="tag">' + esc(q.k) + '</span><span class="tag" style="background:' + statusBg + '; color:' + statusColor + '; font-weight:700;">' + statusLabel + '</span></div><span class="review-toggle-btn">Details <span class="review-toggle-icon">▼</span></span></div><p class="qtext" style="font-size:1.05rem; margin-top:.35rem;">' + esc(q.q) + '</p></summary><div class="review-content">' + renderReviewContent(q, f.it) + '<div id="review-hintergrund-' + q.id + '"></div></div></details>';
    });
    h += '</div></section>';
  } else if (res.details && res.details.length) { h += '<section class="karte"><p class="note" style="color:var(--ok); font-weight:600;">Hervorragend! Alle beantworteten Fragen waren fehlerfrei.</p></section>'; }
  main.innerHTML = h;
}

function renderPractice(main) {
  const fehlerIds = getFehlerFragenIds(); let h = '';
  if (fehlerIds.length > 0) { h += '<section class="karte banner-learn"><span class="eyebrow" style="color:var(--warn); -webkit-text-fill-color:var(--warn); background:none;">Lernchance</span><h2 class="titel" style="color:var(--warn);">Gezieltes Fehler-Training (' + fehlerIds.length + ' Fragen)</h2><p>Trainiere ausschließlich Fragen, die du in Prüfungen falsch beantwortet hast. Vor jeder Frage erhältst du den passenden Lernmappen-Auszug zum Wiederholen.</p><div class="row"><button class="btn warn grow" onclick="starteFehlerLernmodus()">📖 Fehler-Training mit Lernmappe starten</button></div></section>'; }
  h += '<section class="karte"><h2 class="titel">Themenfelder filtern</h2><p>Wähle aus, welche Themengebiete du gezielt üben möchtest.</p><div class="chips">';
  Object.keys(DATA.kat).forEach(k => { const active = filt.kat[k] !== false; const count = FR.filter(q => q.k === k).length; h += '<button class="chip" aria-pressed="' + active + '" onclick="toggleFilt(\'' + k + '\')"><span class="hk"></span><span>' + esc(k) + '</span><span class="n">' + count + '</span></button>'; });
  h += '</div><div class="row" style="margin-top:1rem;"><button class="btn primary" onclick="starteUebung()">Training starten</button></div></section>';
  main.innerHTML = h;
}

window.toggleFilt = function(k) { filt.kat[k] = !filt.kat[k]; store.set('filt', filt); render(); };

window.starteUebung = function() {
  const aktive = Object.keys(filt.kat).filter(k => filt.kat[k]); const pool = FR.filter(q => aktive.includes(q.k));
  if (!pool.length) { alert("Bitte wähle mindestens ein Themenfeld aus."); return; }
  const q = pool[Math.floor(Math.random() * pool.length)]; renderEinzelFrage(q);
};

function renderEinzelFrage(q, beantwortet, it) {
  const main = document.getElementById('main'); it = it || neuesItem(q); const t = typ(q);
  let h = '<article class="karte"><div class="qmeta"><span class="tag">' + esc(q.k) + '</span></div>';
  if (t !== 'lt') h += '<p class="qtext">' + esc(q.q) + '</p>';

  if (t === 'mc') {
    h += '<fieldset class="opts"' + (beantwortet ? ' disabled' : '') + '>';
    it.p.forEach((opt, displayIdx) => {
      const isSelected = it.sel.includes(displayIdx); const isCorrect = !!opt.correct; let cls = ''; let badgeHtml = '';
      if (beantwortet) {
        if (isSelected && isCorrect) { cls = ' is-ok'; badgeHtml = '<span class="badge">✔ Richtig gewählt</span>'; }
        else if (isSelected && !isCorrect) { cls = ' is-bad'; badgeHtml = '<span class="badge">✖ Falsch gewählt</span>'; }
        else if (!isSelected && isCorrect) { cls = ' is-miss'; badgeHtml = '<span class="badge">➕ Hat gefehlt</span>'; } else { cls = ' is-muted'; }
      }
      h += '<label class="opt' + cls + '"><input type="checkbox" onchange="toggleUebungMc(' + displayIdx + ')"' + (isSelected ? ' checked' : '') + '><span class="let">' + String.fromCharCode(65 + displayIdx) + '</span><span class="ot">' + esc(opt.text) + '</span>' + badgeHtml + '</label>';
    });
    h += '</fieldset>';
  } else if (t === 'zo') {
    h += '<div class="zo">';
    it.r.forEach((zi, j) => {
      const linksKey = q.z[zi][0]; const svgIcon = SVG_ICONS[linksKey]; const linksHtml = svgIcon ? '<span class="zo-bild">' + svgIcon + '</span>' : '<span class="zo-text">' + esc(linksKey) + '</span>';
      let cls = ''; let fixHtml = '';
      if (beantwortet) { const ok = it.a[j] && it.a[j].trim().toLowerCase() === q.z[zi][1].trim().toLowerCase(); cls = ok ? ' is-ok' : ' is-bad'; if (!ok) { fixHtml = '<div class="zo-fix">Richtig: ' + esc(q.z[zi][1]) + '</div>'; } }
      h += '<div class="zo-row' + (!svgIcon ? ' zo-txt' : '') + cls + '">' + linksHtml + '<select class="zsel' + (it.a[j] ? ' voll' : '') + '"' + (beantwortet ? ' disabled' : '') + ' onchange="setUebungZo(' + j + ', this.value)"><option value="">-- Bitte wählen --</option>';
      it.c.forEach((cText) => { h += '<option value="' + esc(cText) + '"' + (it.a[j] === cText ? ' selected' : '') + '>' + esc(cText) + '</option>'; }); h += '</select>' + fixHtml + '</div>';
    });
    h += '</div>';
  } else if (t === 'lt') {
    let text = esc(q.q);
    q.l.forEach((gap, g) => {
      let cls = ''; if (beantwortet) { const isOk = it.a[g] && it.a[g].trim().toLowerCase() === gap.correct.trim().toLowerCase(); cls = isOk ? ' is-ok' : ' is-bad'; }
      let selHtml = '<select class="gap' + (it.a[g] ? ' voll' : '') + cls + '"' + (beantwortet ? ' disabled' : '') + ' onchange="setUebungLt(' + g + ', this.value)"><option value="">-- Lücke ' + (g + 1) + ' --</option>';
      it.o[g].forEach((optText) => { selHtml += '<option value="' + esc(optText) + '"' + (it.a[g] === optText ? ' selected' : '') + '>' + esc(optText) + '</option>'; });
      selHtml += '</select>'; text = text.replace('___', selHtml);
    });
    h += '<div class="lt">' + text + '</div>';
  }

  if (beantwortet) {
    const ant = anteil(q, it); const ok = ant === 1;
    h += '<div class="feedback ' + (ok ? 'ok' : 'bad') + '" style="margin-top:1rem;"><div class="verdict">' + (ok ? 'Richtig gelöst!' : 'Leider nicht ganz richtig!') + '</div>' + (q.e ? '<p class="small">' + esc(q.e) + '</p>' : '') + (q.s ? '<p class="src">Quelle: ' + esc(q.s) + '</p>' : '') + '</div>';
    h += '<div id="uebung-hintergrund-' + q.id + '"></div>';
    h += '<div class="row" style="margin-top:1rem;"><button class="btn primary" onclick="starteUebung()">Nächste Übungsfrage</button><button class="btn" onclick="geh(\'practice\')">Filter anpassen</button></div>';
    main.innerHTML = h; setTimeout(() => ladeHintergrund(q.id, 'uebung-hintergrund-' + q.id), 50);
  } else {
    h += '<div class="row" style="margin-top:1rem;"><button class="btn primary" onclick="pruefeUebungFrage()">Antwort prüfen</button></div></article>'; main.innerHTML = h;
  }
  window._curUebung = { q: q, it: it };
}

window.toggleUebungMc = function(idx) { const it = window._curUebung.it; const pos = it.sel.indexOf(idx); if (pos >= 0) it.sel.splice(pos, 1); else it.sel.push(idx); };
window.setUebungZo = function(j, val) { window._curUebung.it.a[j] = val; }; window.setUebungLt = function(g, val) { window._curUebung.it.a[g] = val; };
window.pruefeUebungFrage = function() { renderEinzelFrage(window._curUebung.q, true, window._curUebung.it); };

function renderHistory(main) {
  const fehlerIds = getFehlerFragenIds();
  let h = '<section class="karte"><h2 class="titel">Prüfungsverlauf</h2>';
  if (!hist.length) { h += '<p class="muted">Noch keine Prüfungen absolviert.</p>'; } else {
    if (fehlerIds.length > 0) {
      h += '<div class="note" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6rem; margin-bottom:.8rem;"><span>Aktuell sind <b>' + fehlerIds.length + ' Fragen</b> mit Fehlern im System vermerkt.</span><button class="btn warn" style="min-height:36px; padding:.3rem .8rem; font-size:.9rem;" onclick="starteFehlerLernmodus()">📖 Fehler-Training mit Lernmappe</button></div>';
    }
    h += '<div style="overflow-x:auto;"><table><thead><tr><th>Datum</th><th>Zeit</th><th>Punkte</th><th>Prozent</th><th>Ergebnis</th><th>Details</th></tr></thead><tbody>';
    hist.forEach((e, idx) => {
      h += '<tr><td>' + e.datum + '</td><td>' + e.zeit + '</td><td class="num">' + e.punkte + ' / ' + e.max + '</td><td class="num"><b>' + e.pct + ' %</b></td><td><span class="pill ' + (e.bestanden ? 'ok' : 'bad') + '">' + (e.bestanden ? 'Bestanden' : (e.abgebrochen ? 'Abgebrochen' : 'Nicht bestanden')) + '</span></td><td><button class="btn leise" style="min-height:28px; padding:0 .4rem; font-size:.8rem;" onclick="zeigeHistorieErgebnis(' + idx + ')">Prüfen</button></td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</section>';

  h += '<section class="karte"><h3 class="titel small">Stärken & Schwächen nach Themen</h3><div class="lb">';
  Object.keys(DATA.kat).forEach(k => {
    let n = 0, r = 0; FR.filter(q => q.k === k).forEach(q => { if (stats[q.id]) { n += stats[q.id].n; r += stats[q.id].r; } });
    const pct = n ? Math.round((r / n) * 100) : 0; const isGood = pct >= 75;
    h += '<div class="lb-row"><div class="lb-sym ' + (n ? (isGood ? 'good' : 'weak') : '') + '"></div><div class="lb-lbl">' + esc(k) + '</div><div class="lb-val">' + (n ? pct + ' %' : '–') + '</div><div class="lb-track"><span class="' + (isGood ? 'good' : 'weak') + '" style="width:' + pct + '%;"></span></div></div>';
  });
  h += '</div></section>';
  main.innerHTML = h;
}

window.zeigeHistorieErgebnis = function(idx) { if (hist[idx]) renderErgebnis(hist[idx]); };

window.addEventListener('DOMContentLoaded', () => { 
  initTheme(); 
  checkUserSession();
  ladeKursUndStarte(); 
});
